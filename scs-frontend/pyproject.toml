[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-telemetry"
version = "0.1.0"
description = "Local serial telemetry collection and analysis for SCS"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["scs"]

[tool.setuptools.package-data]
scs = ["static/*", "static/vendor/*"]
